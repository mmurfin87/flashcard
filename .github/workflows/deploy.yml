name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/music-note-flashcards-es392w
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html style.css site/
          cp -r dist site/dist
          # Cache-bust every module URL (the entry script tag plus each
          # relative ES module import) with the commit SHA, so browsers
          # can't keep serving a stale dist/*.js after a deploy.
          sed -i "s/dist\/app\.js\"/dist\/app.js?v=${GITHUB_SHA}\"/" site/index.html
          sed -i -E "s/from '(\.\/[a-zA-Z0-9_-]+\.js)'/from '\1?v=${GITHUB_SHA}'/" site/dist/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
